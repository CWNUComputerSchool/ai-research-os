<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CWNU AI Research OS Logo Preview</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #64748b;
        --line: #e5e7eb;
        --soft: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--soft);
        color: var(--ink);
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }
      main {
        width: min(1180px, calc(100vw - 48px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
      }
      section {
        margin-top: 24px;
      }
      .preview {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        padding: 28px;
        overflow: hidden;
      }
      .dark {
        background: #09090b;
      }
      .grid {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 24px;
        align-items: center;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      @media (max-width: 760px) {
        main {
          width: min(100vw - 28px, 1180px);
          padding-top: 24px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>西华师范大学AI赋能科研系统 Logo Preview</h1>
      <p>CWNU AI Research OS visual identity drafts for website header, dark mode, and app icon use.</p>

      <section>
        <h2>Primary Light Lockup</h2>
        <div class="preview">
          <img src="./cwnu-ai-logo-full.svg" alt="Primary CWNU AI Research OS logo" />
        </div>
      </section>

      <section>
        <h2>Dark Mode Lockup</h2>
        <div class="preview dark">
          <img src="./cwnu-ai-logo-dark.svg" alt="Dark mode CWNU AI Research OS logo" />
        </div>
      </section>

      <section class="grid">
        <div>
          <h2>App Icon / Favicon</h2>
          <p>Use this compact mark for collapsed sidebars, browser icons, and social avatars.</p>
        </div>
        <div class="preview">
          <img src="./cwnu-ai-logo-mark.svg" alt="CWNU AI Research OS logo mark" />
        </div>
      </section>
    </main>
  </body>
</html>
